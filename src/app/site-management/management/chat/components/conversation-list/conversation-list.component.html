<section
  class="conversation-list flex h-full w-80 shrink-0 flex-col overflow-hidden border-r border-[#d2c5ab]/30 bg-white"
  aria-label="Danh sách tư vấn khách hàng"
>
  <div class="shrink-0 border-b border-[#d2c5ab]/30 p-4">
    <label class="relative flex items-center">
      <svg
        lucideSearch
        class="absolute left-3 h-4 w-4 text-[#4f4632]/70"
        [attr.stroke-width]="2"
      ></svg>
      <input
        class="h-10 w-full rounded-[8px] border-0 bg-[#f6f3f2] pl-9 pr-4 text-sm text-[#1c1b1b] outline-none ring-1 ring-transparent transition placeholder:text-[#4f4632]/70 focus:bg-white focus:ring-[#ffc700]"
        type="search"
        placeholder="Tìm kiếm tư vấn..."
        [value]="searchKeyword()"
        (input)="onSearchChange($event)"
      />
    </label>

    <div class="mt-3 flex items-center gap-2">
      <button
        type="button"
        class="h-9 shrink-0 rounded-[8px] px-3 text-xs font-bold transition ring-1 ring-inset"
        [class.bg-[#ffc700]]="myHandlingOnly()"
        [class.text-[#1c1b1b]]="myHandlingOnly()"
        [class.ring-[#ffc700]]="myHandlingOnly()"
        [class.bg-[#f6f3f2]]="!myHandlingOnly()"
        [class.text-[#4f4632]]="!myHandlingOnly()"
        [class.ring-[#d2c5ab]/50]="!myHandlingOnly()"
        [attr.aria-pressed]="myHandlingOnly()"
        (click)="myHandlingFilterToggled.emit()"
      >
        Tôi đang tư vấn
      </button>

      <label class="min-w-0 flex-1">
        <span class="sr-only">Lọc theo lưu trữ</span>
        <select
          class="h-9 w-full rounded-[8px] border-0 bg-[#f6f3f2] px-3 text-xs font-bold text-[#4f4632] outline-none ring-1 ring-inset ring-[#d2c5ab]/50 transition focus:bg-white focus:ring-[#ffc700]"
          [value]="archiveFilter()"
          (change)="onArchiveFilterChange($event)"
        >
          <option value="ALL">Tất cả lưu trữ</option>
          <option value="UNARCHIVED">Chưa lưu trữ</option>
          <option value="ARCHIVED">Đã lưu trữ</option>
        </select>
      </label>
    </div>
  </div>

  <div class="chat-scrollbar min-h-0 flex-1 overscroll-contain space-y-1 overflow-y-auto p-2">
    @for (conversation of conversations(); track conversation.id) {
      <button
        type="button"
        class="group relative flex w-full min-w-0 gap-3 rounded-[8px] p-3 text-left transition hover:bg-[#f6f3f2]"
        [class.bg-[#ffc700]/10]="selectedConversationId() === conversation.id"
        (click)="conversationSelected.emit(conversation.id)"
      >
        @if (selectedConversationId() === conversation.id) {
          <span
            class="absolute left-0 top-1/2 h-8 w-1 -translate-y-1/2 rounded-r-full bg-[#ffc700]"
            aria-hidden="true"
          ></span>
        }

        <span class="relative shrink-0">
          @if (conversation.customer.avatarUrl && !isImageFailed(conversation.id)) {
            <img
              class="h-10 w-10 rounded-[5px] bg-[#f0edec] object-cover"
              [src]="conversation.customer.avatarUrl"
              [alt]="conversation.customer.fullName"
              referrerpolicy="no-referrer"
              (error)="onImageError(conversation.id)"
            />
          } @else {
            <span
              class="grid h-10 w-10 place-items-center rounded-[5px] bg-[#645efb] text-xs font-bold text-white"
            >
              {{ conversation.customer.initials }}
            </span>
          }

          @if (conversation.customer.online) {
            <span
              class="absolute -bottom-1 -right-1 h-3 w-3 rounded-full border-2 border-white bg-green-500"
              aria-label="Online"
            ></span>
          }
        </span>

        <span class="min-w-0 flex-1">
          <span class="mb-0.5 flex min-w-0 items-baseline justify-between gap-3">
            <strong class="min-w-0 truncate text-sm text-[#1c1b1b]" [class.font-extrabold]="conversation.unreadCount > 0">
              {{ conversation.customer.fullName }}
            </strong>
            <span class="shrink-0 text-[10px] font-bold text-[#765b00]">
              {{ conversation.lastMessageAtLabel }}
            </span>
          </span>
          <span class="flex min-w-0 items-center gap-2">
            <span class="min-w-0 flex-1 truncate text-xs font-medium text-[#4f4632]">
              {{ conversation.lastMessagePreview }}
            </span>
            @if (conversation.archived) {
              <span
                class="inline-flex shrink-0 items-center gap-1 rounded-full bg-[#fff3cd] px-2 py-0.5 text-[10px] font-bold text-[#765b00] ring-1 ring-inset ring-[#e8c45c]/50"
                title="Khách hàng đã lưu trữ hội thoại"
              >
                <svg lucideArchive class="h-3 w-3" [attr.stroke-width]="2.5" aria-hidden="true"></svg>
                Lưu trữ
              </span>
            }
          </span>
        </span>

        @if (conversation.unreadCount > 0) {
          <span
            class="grid h-6 w-6 shrink-0 place-items-center self-center rounded-full bg-[#ffc700] text-[11px] font-bold text-[#1c1b1b]"
          >
            {{ conversation.unreadCount }}
          </span>
        }
      </button>
    } @empty {
      <div class="px-4 py-10 text-center text-sm font-semibold text-[#4f4632]">
        Không có tư vấn phù hợp.
      </div>
    }
  </div>
</section>
